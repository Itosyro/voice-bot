name: DVIZH Hermes Autopilot v2 CI

on:
  push:
    paths:
      - 'hermes-dev-v2/**'
      - 'tests/hermes_autopilot/**'
      - 'install-dvizh-hermes-autopilot.sh'
      - '.github/workflows/dvizh-hermes-autopilot.yml'
      - '.github/workflows/dvizh-hermes-autopilot-v2-tests.yml'
  pull_request:
    paths:
      - 'hermes-dev-v2/**'
      - 'tests/hermes_autopilot/**'
      - 'install-dvizh-hermes-autopilot.sh'
      - '.github/workflows/dvizh-hermes-autopilot.yml'
      - '.github/workflows/dvizh-hermes-autopilot-v2-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-autopilot-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and static security boundary
        run: |
          set -Eeuo pipefail
          python3 -m py_compile hermes-dev-v2/dvizhautopilot.py hermes-dev-v2/dvizhrelease.py
          grep -Fq 'VERSION = "2026.09.08-hermes-autopilot.1"' hermes-dev-v2/dvizhautopilot.py
          grep -Fq 'VERSION = "2026.09.08-dvizh-release-gate.1"' hermes-dev-v2/dvizhrelease.py
          grep -Fq '^name: dvizh-dev$' hermes-dev-v2/skill/SKILL.md
          grep -Fq 'Do not call release-apply until a later user Telegram message contains that exact phrase.' hermes-dev-v2/skill/SKILL.md
          grep -Fq 'SAFE_TARGETS' hermes-dev-v2/dvizhrelease.py
          grep -Fq 'DENY_PREFIXES' hermes-dev-v2/dvizhrelease.py
          grep -Fq 'consume_approval' hermes-dev-v2/dvizhrelease.py
          ! grep -Eq 'shell\s*=\s*True|os\.system\(' hermes-dev-v2/*.py
          ! grep -Eq 'git[^\n]*push[^\n]*--force|reset[^\n]*--hard|clean[^\n]*-fd' hermes-dev-v2/*
      - name: Unit and rollback tests
        run: python3 -m unittest discover -s tests/hermes_autopilot -v

  workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Generic Hermes branch CI must gate secrets and AI browser smoke
        run: |
          set -Eeuo pipefail
          grep -Fq "'hermes/dev/**'" .github/workflows/dvizh-hermes-autopilot.yml
          grep -Fq 'credential-shaped path forbidden' .github/workflows/dvizh-hermes-autopilot.yml
          grep -Fq 'playwright==1.57.0' .github/workflows/dvizh-hermes-autopilot.yml
          grep -Fq 'python tests/ai-home-v2/browser_test.py' .github/workflows/dvizh-hermes-autopilot.yml
          grep -Fq 'Autopilot gate: green' .github/workflows/dvizh-hermes-autopilot.yml

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [contracts, workflow-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no unrestricted root surface
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('hermes-dev-v2/dvizhrelease.py').read_text()
          required=[
            '"/opt/dvizh/static/index.html"',
            '"/opt/dvizh/static/ai-home-v2.js"',
            '"/opt/dvizh/static/ai-home-v2.css"',
            '"/opt/dvizh/server.py"',
            'ALLOWED_RESTARTS',
            'target is outside the release allowlist',
            'approval challenge does not match this exact proposal',
          ]
          for marker in required:
            if marker not in text: raise SystemExit(f'missing marker: {marker}')
          for forbidden in ['/etc/systemd/system/', '/var/lib/dvizh/auth', 'iptables', 'ufw ', 'authorized_keys']:
            if forbidden in text: raise SystemExit(f'forbidden root surface: {forbidden}')
          PY
