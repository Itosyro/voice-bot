name: DVIZH web schedule editor tests

on:
  push:
    branches:
      - codex/dvizh-web-schedule-editor-v1-2026-08-29
    paths:
      - 'web-week-editor-v1/**'
      - 'install-dvizh-web-schedule-editor.sh'
      - '.github/workflows/dvizh-web-editor-tests.yml'
  pull_request:
    paths:
      - 'web-week-editor-v1/**'
      - 'install-dvizh-web-schedule-editor.sh'
      - '.github/workflows/dvizh-web-editor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Static checks
        run: |
          bash -n install-dvizh-web-schedule-editor.sh
          python -m py_compile web-week-editor-v1/patch_web_editor.py web-week-editor-v1/web_schedule_editor_bridge.py
      - name: Editor bridge and UI upgrade tests
        run: pytest -q web-week-editor-v1/tests
