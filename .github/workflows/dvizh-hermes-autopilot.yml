name: DVIZH Hermes Autopilot Gate

on:
  push:
    branches:
      - 'hermes/dev/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvizh-hermes-autopilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      ai_home: ${{ steps.paths.outputs.ai_home }}
      autopilot: ${{ steps.paths.outputs.autopilot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='origin/codex/hermes-autopilot-v2-2026-09-08'
          git fetch origin codex/hermes-autopilot-v2-2026-09-08 --depth=1
          merge="$(git merge-base HEAD "$BASE")"
          git diff --name-only "$merge" HEAD -- . > /tmp/changed
          echo 'Changed files:'
          cat /tmp/changed
          ai=false
          auto=false
          grep -Eq '^(ai-home-v2/|tests/ai-home-v2/)' /tmp/changed && ai=true || true
          grep -Eq '^(hermes-dev-v2/|tests/hermes_autopilot/|install-dvizh-hermes-autopilot\.sh$|\.github/workflows/dvizh-hermes-autopilot\.yml$)' /tmp/changed && auto=true || true
          echo "ai_home=$ai" >> "$GITHUB_OUTPUT"
          echo "autopilot=$auto" >> "$GITHUB_OUTPUT"

  safety:
    runs-on: ubuntu-latest
    needs: [classify]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate changed files and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='origin/codex/hermes-autopilot-v2-2026-09-08'
          git fetch origin codex/hermes-autopilot-v2-2026-09-08 --depth=1
          merge="$(git merge-base HEAD "$BASE")"
          git diff --check "$merge" HEAD -- .
          git diff --name-only -z "$merge" HEAD -- . > /tmp/changed.z
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, re
          raw=Path('/tmp/changed.z').read_bytes().split(b'\0')
          names=[x.decode('utf-8') for x in raw if x]
          forbidden=[
            re.compile(r'(^|/)(\.env(?:\.|$)|credentials?(?:\.|$)|secrets?(?:\.|$)|auth\.json$)', re.I),
            re.compile(r'\.(pem|key|p12|pfx)$', re.I),
          ]
          spec=importlib.util.spec_from_file_location('dvizhgitpush_ci', Path('hermes-dev-v2/dvizhgitpush.py'))
          gate=importlib.util.module_from_spec(spec); spec.loader.exec_module(gate)
          for name in names:
            if name.startswith('/') or '..' in Path(name).parts:
              raise SystemExit(f'unsafe path: {name}')
            if any(rx.search(name) for rx in forbidden):
              raise SystemExit(f'credential-shaped path forbidden: {name}')
            if not gate.path_allowed(name):
              raise SystemExit(f'DVIZH-only path gate rejected: {name}')
            p=Path(name)
            if p.is_file() and p.stat().st_size > 5_000_000:
              raise SystemExit(f'changed file too large: {name}')
          print(f'DVIZH-only validated {len(names)} changed paths')
          PY
          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.sh) bash -n "$file" ;;
              *.py) python3 -m py_compile "$file" ;;
              *.js) node --check "$file" ;;
              *.cjs) node --check "$file" ;;
            esac
          done < /tmp/changed.z
      - name: Validate committed release manifest when present
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ! -f .autopilot/release.json ]] && exit 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.autopilot/release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('schema') != 1: raise SystemExit('release schema must be 1')
          ops=d.get('operations')
          if not isinstance(ops,list) or not (1 <= len(ops) <= 20): raise SystemExit('operations must be 1..20')
          for op in ops:
            if not isinstance(op,dict): raise SystemExit('operation must be object')
            if set(op)-{'source','target','http_path'}: raise SystemExit('unsupported operation key')
            src=str(op.get('source') or ''); target=str(op.get('target') or '')
            if not src or Path(src).is_absolute() or '..' in Path(src).parts: raise SystemExit(f'unsafe source: {src}')
            if not target.startswith('/') or '..' in Path(target).parts: raise SystemExit(f'unsafe target: {target}')
          restarts=d.get('restarts',[])
          if not isinstance(restarts,list): raise SystemExit('restarts must be list')
          print('release manifest structurally valid')
          PY

  autopilot-tests:
    if: needs.classify.outputs.autopilot == 'true'
    runs-on: ubuntu-latest
    needs: [classify, safety]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Autopilot controller and root gates
        run: |
          set -Eeuo pipefail
          python3 -m py_compile hermes-dev-v2/dvizhautopilot.py hermes-dev-v2/dvizhrelease.py hermes-dev-v2/dvizhgitpush.py
          python3 -m unittest discover -s tests/hermes_autopilot -v

  ai-home-contracts:
    if: needs.classify.outputs.ai_home == 'true'
    runs-on: ubuntu-latest
    needs: [classify, safety]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run AI Home contracts
        run: |
          set -Eeuo pipefail
          node --check ai-home-v2/ai-home-v2.js
          node --test tests/ai-home-v2/*.test.cjs
          python3 tests/ai-home-v2/promote_byte_smoke_test.py
          python3 tests/ai-home-v2/bridge_contract_test.py

  ai-home-browser:
    if: needs.classify.outputs.ai_home == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify, safety]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium on disposable runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run browser smoke
        run: python tests/ai-home-v2/browser_test.py

  gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [classify, safety, autopilot-tests, ai-home-contracts, ai-home-browser]
    steps:
      - name: Require every applicable job to pass
        shell: bash
        env:
          SAFETY: ${{ needs.safety.result }}
          AUTO_WANTED: ${{ needs.classify.outputs.autopilot }}
          AUTO_RESULT: ${{ needs.autopilot-tests.result }}
          AI_WANTED: ${{ needs.classify.outputs.ai_home }}
          AI_CONTRACTS: ${{ needs.ai-home-contracts.result }}
          AI_BROWSER: ${{ needs.ai-home-browser.result }}
        run: |
          set -Eeuo pipefail
          [[ "$SAFETY" == success ]]
          if [[ "$AUTO_WANTED" == true ]]; then [[ "$AUTO_RESULT" == success ]]; fi
          if [[ "$AI_WANTED" == true ]]; then
            [[ "$AI_CONTRACTS" == success ]]
            [[ "$AI_BROWSER" == success ]]
          fi
          echo 'Autopilot gate: green'
