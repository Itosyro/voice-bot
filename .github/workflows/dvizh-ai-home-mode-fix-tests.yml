name: DVIZH AI Home mode fix tests
on:
  push:
    branches: [codex/dvizh-ai-home-v1-2026-09-05]
    paths: ['install-dvizh-ai-home-mode-fix.sh', '.github/workflows/dvizh-ai-home-mode-fix-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test cache-agnostic patch
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n install-dvizh-ai-home-mode-fix.sh
          ROOT=/tmp/dvizh-mode-fix
          mkdir -p "$ROOT"
          printf '%s\n' "const DVIZH_AI_HOME_V1 = true;" "function aiHomeEnsureRoot() {" "  const home = document.getElementById('view-home');" "  if (!home) return null;" "  home.classList.add('ai-home-mode');" "  let root = document.getElementById('aiHomeShell');" "}" "function aiHomeEnsureManualBack() {}" "function aiHomeRender() {}" "function aiHomeBoot() {" "  aiHomeEnsureRoot();" "  aiHomeEnsureManualBack();" "  aiHomeRender();" "}" > "$ROOT/app.js"
          printf '%s\n' "self.addEventListener('fetch', () => {});" > "$ROOT/sw.js"
          printf '%s\n' '<script src="app.js"></script>' > "$ROOT/index.html"
          DVIZH_AI_HOME_MODE_FIX_ROOT="$ROOT" bash install-dvizh-ai-home-mode-fix.sh
          grep -q 'DVIZH_AI_HOME_MODE_STABLE_V1' "$ROOT/app.js"
          grep -q 'DVIZH_AI_HOME_MODE_STABLE_SW_V3' "$ROOT/sw.js"
          grep -q 'app.js?v=dvizh-ai-home-mode-stable-v3' "$ROOT/index.html"
          python3 - "$ROOT/app.js" <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8').read()
          a=text.index('function aiHomeEnsureRoot()')
          b=text.index('function aiHomeEnsureManualBack()',a)
          assert "classList.add('ai-home-mode')" not in text[a:b]
          a=text.index('function aiHomeBoot()')
          assert "classList.add('ai-home-mode')" in text[a:]
          PY
          node --check "$ROOT/app.js"
