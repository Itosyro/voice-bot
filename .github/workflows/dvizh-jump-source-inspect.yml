name: DVIZH Jump source inspect

on:
  push:
    branches:
      - codex/dvizh-social-content-v1-2026-09-03-inspect
    paths:
      - '.github/workflows/dvizh-jump-source-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Jump Lab source
        shell: bash
        run: |
          set -Eeuo pipefail
          cat jump-goal-release/part-*.b64 | base64 --decode > /tmp/jump.tar.gz
          echo 'd1c26b523e56093fb710d2ab31036c65a78ed870e509f7f451f85848daba51db  /tmp/jump.tar.gz' | sha256sum -c -
          mkdir -p /tmp/jump-src
          tar -xzf /tmp/jump.tar.gz -C /tmp/jump-src
          find /tmp/jump-src -type f -printf '%P\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: dvizh-jump-source
          path: /tmp/jump-src
          if-no-files-found: error
          retention-days: 1
