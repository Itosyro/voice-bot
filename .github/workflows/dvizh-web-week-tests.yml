name: DVIZH web week tests

on:
  push:
    branches:
      - codex/dvizh-web-week-v1-2026-08-29
    paths:
      - 'dvizh-web-week-v1/**'
      - 'install-dvizh-web-week.sh'
      - '.github/workflows/dvizh-web-week-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: Static checks
        run: |
          bash -n install-dvizh-web-week.sh
          python -m py_compile dvizh-web-week-v1/week_web.py dvizh-web-week-v1/patch_auth_gateway.py
      - name: Shared week persistence tests
        env:
          PYTHONPATH: dvizh-web-week-v1
        run: pytest -q dvizh-web-week-v1/test_week_web.py
      - name: Patch current auth gateway shape
        shell: bash
        run: |
          set -Eeuo pipefail
          cat dvizh-auth-release/part-*.b64 | base64 --decode > /tmp/auth-release.tar.gz
          mkdir -p /tmp/auth-release
          tar -xzf /tmp/auth-release.tar.gz -C /tmp/auth-release
          cp dvizh-web-week-v1/week_web.py /tmp/auth-release/dvizh-auth-build/week_web.py
          python dvizh-web-week-v1/patch_auth_gateway.py /tmp/auth-release/dvizh-auth-build/auth_gateway.py
          python -m py_compile /tmp/auth-release/dvizh-auth-build/auth_gateway.py /tmp/auth-release/dvizh-auth-build/week_web.py
          grep -q 'gateway.week.handle' /tmp/auth-release/dvizh-auth-build/auth_gateway.py
          grep -q 'inject_main_entry' /tmp/auth-release/dvizh-auth-build/auth_gateway.py
