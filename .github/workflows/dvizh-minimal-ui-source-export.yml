name: Export current DVIZH web patch sources

on:
  push:
    branches:
      - codex/dvizh-minimal-ui-v1-2026-09-04
    paths:
      - '.github/workflows/dvizh-minimal-ui-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct current module sources
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/dvizh-current-sources
          mkdir -p /tmp/dvizh-current-sources

          cat social-release-v2/part-*.b64 | base64 --decode > /tmp/dvizh-social-release.tar.gz
          echo '709137e20a89b3e157f5a51964d93e48ee01001b4faf66a38dde7397fce8c64b  /tmp/dvizh-social-release.tar.gz' | sha256sum -c -
          mkdir -p /tmp/dvizh-current-sources/social
          tar -xzf /tmp/dvizh-social-release.tar.gz -C /tmp/dvizh-current-sources/social

          cat jump-goal-release/part-*.b64 | base64 --decode > /tmp/dvizh-jump-release.tar.gz
          echo 'd1c26b523e56093fb710d2ab31036c65a78ed870e509f7f451f85848daba51db  /tmp/dvizh-jump-release.tar.gz' | sha256sum -c -
          mkdir -p /tmp/dvizh-current-sources/jump
          tar -xzf /tmp/dvizh-jump-release.tar.gz -C /tmp/dvizh-current-sources/jump

          cp -a training-readiness-v1 /tmp/dvizh-current-sources/training-readiness-v1
          cp -a web-week-v1 /tmp/dvizh-current-sources/web-week-v1
          cp -a web-week-editor-v1 /tmp/dvizh-current-sources/web-week-editor-v1

      - name: Upload current patch sources
        uses: actions/upload-artifact@v4
        with:
          name: dvizh-current-web-patch-sources-full
          path: /tmp/dvizh-current-sources
          if-no-files-found: error
          retention-days: 1
