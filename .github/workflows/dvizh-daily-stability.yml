name: DVIZH daily stability acceptance
on:
  push:
    branches: ['chatgpt/dvizh-daily-stability-2026-09-14']
    paths:
      - 'minimal-ui-v1/health-recovery-v1/**'
      - '.github/workflows/dvizh-daily-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dvizh-daily-browser" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/dvizh-daily-browser/node_modules/.bin/playwright" install chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/dvizh-daily-browser/node_modules/playwright" >> "$GITHUB_ENV"
          node -e 'console.log("CHROMIUM_PATH="+require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/dvizh-daily-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Existing Health Recovery acceptance remains unchanged
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/dvizh-daily-evidence"
          bash minimal-ui-v1/health-recovery-v1/tests/run.sh 2>&1 | tee "$RUNNER_TEMP/dvizh-daily-evidence/health.log"
          git diff --exit-code
      - name: Build five-file candidate and run 74 client and 8 build checks
        run: |
          set -o pipefail
          python3 minimal-ui-v1/health-recovery-v1/daily-stability/build.py
          node --test minimal-ui-v1/health-recovery-v1/daily-stability/tests/*lifecycle.cjs 2>&1 | tee "$RUNNER_TEMP/dvizh-daily-evidence/unit.log"
          python3 minimal-ui-v1/health-recovery-v1/daily-stability/tests/test_contract.py 2>&1 | tee "$RUNNER_TEMP/dvizh-daily-evidence/build-contract.log"
      - name: Real daily application browser flows
        run: |
          set -o pipefail
          node minimal-ui-v1/health-recovery-v1/daily-stability/tests/browser-daily.cjs 2>&1 | tee "$RUNNER_TEMP/dvizh-daily-evidence/daily-browser.log"
      - name: Unchanged Health browser assertions against the NEW candidate
        run: |
          set -o pipefail
          python3 minimal-ui-v1/health-recovery-v1/daily-stability/tests/health_matrix.py 2>&1 | tee "$RUNNER_TEMP/dvizh-daily-evidence/health-new-client.log"
          python3 minimal-ui-v1/health-recovery-v1/daily-stability/build.py --check
          git diff --exit-code
      - name: Package exact candidate and source (never deploy)
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/dvizh-daily-evidence/COMMIT"
          git ls-tree -r HEAD -- minimal-ui-v1/health-recovery-v1 ai-home-v2 hermes-control-v1 tests/ai-home-v2 > "$RUNNER_TEMP/dvizh-daily-evidence/TREE.txt"
          git archive --format=tar.gz -o "$RUNNER_TEMP/dvizh-daily-evidence/source.tar.gz" HEAD -- minimal-ui-v1/health-recovery-v1 ai-home-v2 hermes-control-v1 tests/ai-home-v2
          tar -czf "$RUNNER_TEMP/dvizh-daily-evidence/candidate.tar.gz" -C minimal-ui-v1/health-recovery-v1/daily-stability dist PAYLOAD.json release.json
          cd "$RUNNER_TEMP/dvizh-daily-evidence"
          sha256sum candidate.tar.gz source.tar.gz > SHA256SUMS
      - name: Collect browser evidence even on failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/dvizh-daily-evidence/screenshots"
          find minimal-ui-v1/health-recovery-v1/daily-stability/tests -maxdepth 1 -type f -name '*.png' -exec cp {} "$RUNNER_TEMP/dvizh-daily-evidence/screenshots/" \;
          if test -f minimal-ui-v1/health-recovery-v1/daily-stability/tests/browser-results.json; then cp minimal-ui-v1/health-recovery-v1/daily-stability/tests/browser-results.json "$RUNNER_TEMP/dvizh-daily-evidence/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dvizh-daily-stability-evidence
          path: ${{ runner.temp }}/dvizh-daily-evidence/
          if-no-files-found: error
          retention-days: 14
