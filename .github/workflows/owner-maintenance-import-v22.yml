name: Owner maintenance v2.2 verified payload staging

on:
  push:
    branches:
      - 'owner/import-v22-bundle-2026-09-09'
    paths:
      - '.github/workflows/owner-maintenance-import-v22.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-maintenance-v22-staging
  cancel-in-progress: false

jobs:
  verify-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .owner-maintenance/v22/bundle.b64.part* | base64 -d > /tmp/v22.bundle
          test "$(wc -c < /tmp/v22.bundle)" = "46956"
          test "$(sha256sum /tmp/v22.bundle | awk '{print $1}')" = "aa6c7c0b74f3aefd44fdab68d881de52c9fd9091731649b470469c715153c4ea"
          git bundle verify /tmp/v22.bundle
          git fetch /tmp/v22.bundle HEAD
          TARGET="$(git rev-parse FETCH_HEAD)"
          BASE="$(git rev-parse "${TARGET}^")"
          test "$TARGET" = "da7395e436563774a29f7694b258bd85987bed2f"
          test "$BASE" = "accb555b0da3b90eed9d1708ee68a286506d4feb"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
      - name: Verify isolation and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only "$BASE" "$TARGET" > /tmp/changed
          python3 - <<'PY'
          from pathlib import Path
          names=[x for x in Path('/tmp/changed').read_text().splitlines() if x]
          exact={'.github/workflows/dvizh-hermes-autopilot-v2-tests.yml','.github/workflows/dvizh-hermes-autopilot.yml','hermes-dev-v2/.gitattributes','hermes-dev-v2/OWNER-MAINTENANCE-v2.2.md','hermes-dev-v2/dvizhrelease.py','hermes-dev-v2/skill/SKILL.md','tests/hermes_autopilot/test_release_v22.py','tests/hermes_autopilot/test_release_v22_review.py'}
          bad=[p for p in names if not (p in exact or p.startswith('hermes-dev-v2/evidence/v2.2/'))]
          if bad: raise SystemExit('Unexpected paths: '+repr(bad))
          forbidden=('src/','migrations/')
          if any(p.startswith(forbidden) for p in names): raise SystemExit('friend project touched')
          print('isolation OK', len(names))
          PY
          test "$(git rev-parse "$TARGET:hermes-dev-v2/dvizhautopilot.py")" = "1133a558b459dc5c1d4f76af066eb8132506e6be"
          test "$(git rev-parse "$TARGET:hermes-dev-v2/dvizhgitpush.py")" = "71a50de55f30858708b0c5d6e3e7946e3211ff31"
          git worktree add --detach /tmp/v22 "$TARGET"
          cd /tmp/v22
          python3 -m py_compile hermes-dev-v2/dvizhautopilot.py hermes-dev-v2/dvizhgitpush.py hermes-dev-v2/dvizhrelease.py
          python3 -m unittest discover -s tests/hermes_autopilot -v
      - name: Build base-parented commit containing exact non-workflow payload
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'DVIZH Owner Maintenance'
          git config user.email 'owner-maintenance@users.noreply.github.com'
          git checkout --detach "$BASE"
          while IFS= read -r p; do
            case "$p" in
              .github/workflows/dvizh-hermes-autopilot-v2-tests.yml|.github/workflows/dvizh-hermes-autopilot.yml) continue ;;
            esac
            git checkout "$TARGET" -- "$p"
          done < /tmp/changed
          git diff --cached --name-only > /tmp/staged
          test "$(wc -l < /tmp/staged)" = "40"
          ! grep -q '^\.github/workflows/' /tmp/staged
          git commit -m 'Owner maintenance v2.2 verified payload (workflow files staged separately)'
          PAYLOAD_COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE"
          echo "PAYLOAD_COMMIT=$PAYLOAD_COMMIT" >> "$GITHUB_ENV"
      - name: Push non-workflow payload branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin "$PAYLOAD_COMMIT:refs/heads/owner/hermes-autopilot-v2.2-payload-2026-09-10"
