name: Export DVIZH Jump Lab fixture for social module

on:
  push:
    branches:
      - codex/dvizh-social-content-v1-2026-09-03
    paths:
      - '.github/workflows/dvizh-social-fixture-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct installed Jump Lab source fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          cat jump-goal-release/part-*.b64 | base64 --decode > /tmp/jump.tar.gz
          echo 'd1c26b523e56093fb710d2ab31036c65a78ed870e509f7f451f85848daba51db  /tmp/jump.tar.gz' | sha256sum -c -
          mkdir -p /tmp/jump
          tar -xzf /tmp/jump.tar.gz -C /tmp/jump
          find /tmp/jump -type f -printf '%P %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: dvizh-jump-runtime-fixture
          path: /tmp/jump
          retention-days: 1
          if-no-files-found: error
