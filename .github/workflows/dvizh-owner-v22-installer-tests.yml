name: DVIZH Owner v2.2 Installer Tests

on:
  push:
    branches:
      - 'owner/hermes-autopilot-v2.2-install-2026-09-10'
    paths:
      - 'install-dvizh-hermes-autopilot-v2.2-owner-maintenance.sh'
      - 'install-dvizh-hermes-autopilot-v2.2-owner-maintenance-local-preserve.sh'
      - '.github/workflows/dvizh-owner-v22-installer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax and immutable payload contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=install-dvizh-hermes-autopilot-v2.2-owner-maintenance-local-preserve.sh
          bash -n "$SCRIPT"
          grep -Fq 'VERSION="2026.09.10-dvizh-owner-maintenance-v2.2.3-local-preserve"' "$SCRIPT"
          grep -Fq 'PAYLOAD_REF="57a2975bcfc47583e1f87250aca8eccddcfc9ebc"' "$SCRIPT"
          grep -Fq 'BASE_GATE_BLOB="b25a42654300f0e5595763a8b8753188039e34e3"' "$SCRIPT"
          grep -Fq 'TARGET_GATE_BLOB="cf6ec6e4915739fe0b7d2c609b41b4eb7c27d844"' "$SCRIPT"
          grep -Fq 'TARGET_SKILL_BLOB="3a68c550a328ec05a13ec86f1ad44aa4724c4fe1"' "$SCRIPT"
          grep -Fq 'LOCAL_PRESERVE_SKILL_BLOB="082a6ce569a0c0c5bd34d00b8d1957a6d7bca233"' "$SCRIPT"
          test "$(git rev-parse 57a2975bcfc47583e1f87250aca8eccddcfc9ebc^{tree})" = a91ee82d29b9df1d56a37238f5cd6e678a91f110
          test "$(git rev-parse 57a2975bcfc47583e1f87250aca8eccddcfc9ebc:hermes-dev-v2/dvizhrelease.py)" = cf6ec6e4915739fe0b7d2c609b41b4eb7c27d844
          test "$(git rev-parse 57a2975bcfc47583e1f87250aca8eccddcfc9ebc:hermes-dev-v2/skill/SKILL.md)" = 3a68c550a328ec05a13ec86f1ad44aa4724c4fe1
          git show 57a2975bcfc47583e1f87250aca8eccddcfc9ebc:hermes-dev-v2/dvizhrelease.py > /tmp/dvizhrelease.py
          python3 -m py_compile /tmp/dvizhrelease.py
          grep -Fq 'VERSION = "2026.09.09-dvizh-release-gate.2.2"' /tmp/dvizhrelease.py
      - name: Local skill must be append-only preserved
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=install-dvizh-hermes-autopilot-v2.2-owner-maintenance-local-preserve.sh
          grep -Fq 'if not new.startswith(old):' "$SCRIPT"
          grep -Fq 'merge did not preserve installed skill as exact prefix' "$SCRIPT"
          grep -Fq 'local skill content was not preserved byte-for-byte' "$SCRIPT"
          grep -Fq 'cmp -s "$SKILL" "$TMP/merged-SKILL.md"' "$SCRIPT"
          grep -Fq -- "--approval 'APPROVE <proposal-id> <token>'" "$SCRIPT"
          grep -Fq '/usr/local/libexec/dvizh-context' "$SCRIPT"
          grep -Fq '/usr/local/libexec/dvizh-proposals' "$SCRIPT"
          grep -Fq '/opt/dvizh-ai-approval/proposal_bridge.py' "$SCRIPT"
          grep -Fq 'No wildcard under `/usr/local` or `/opt/dvizh-ai-approval` is allowed.' "$SCRIPT"
          grep -Fq 'ALWAYS approval-required' "$SCRIPT"
      - name: Simulate append-only merge and idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          marker = b'## Owner-delivered v2.2 privileged contract'
          old = b'# local skill\nmanual-sync-custom\nquiet-signal-custom\nowner-handoff-custom\n'
          overlay = b'\n## Owner-delivered v2.2 privileged contract\nprivileged rules\n'
          def merge(src):
              if marker in src:
                  return src
              sep = b'' if src.endswith(b'\n') else b'\n'
              return src + sep + overlay
          once = merge(old)
          twice = merge(once)
          assert once.startswith(old)
          assert b'manual-sync-custom' in once
          assert b'quiet-signal-custom' in once
          assert b'owner-handoff-custom' in once
          assert once == twice
          assert once.count(marker) == 1
          print('append-only preservation simulation: green')
          PY
      - name: No root-surface expansion
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=install-dvizh-hermes-autopilot-v2.2-owner-maintenance-local-preserve.sh
          ! grep -Eq 'systemctl|iptables|ufw|authorized_keys|sudoers|id_ed25519|NOPASSWD' "$SCRIPT"
          ! grep -Eq 'rm -rf[[:space:]]+/|chmod[[:space:]]+-R|chown[[:space:]]+-R' "$SCRIPT"
          grep -Fq 'GATE="/usr/local/sbin/dvizhrelease"' "$SCRIPT"
          grep -Fq '.hermes/skills/dvizh/dvizh-dev/SKILL.md' "$SCRIPT"
          grep -Fq 'Rolling back owner-maintenance v2.2 local-preserve' "$SCRIPT"
          grep -Fq 'Services restarted: none' "$SCRIPT"
          grep -Fq 'Friend project: untouched by this installer' "$SCRIPT"
      - name: Payload CI provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Exact v2.2 payload is pinned to 57a2975bcfc47583e1f87250aca8eccddcfc9ebc.'
          echo 'The exact owner payload branch previously passed DVIZH Hermes Autopilot v2 CI; owner verifies the run separately before server install.'
