name: DVIZH Owner v2.2 Installer Tests

on:
  push:
    branches:
      - 'owner/hermes-autopilot-v2.2-install-compat-2026-09-10'
    paths:
      - 'install-dvizh-hermes-autopilot-v2.2-owner-maintenance.sh'
      - '.github/workflows/dvizh-owner-v22-installer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax and immutable payload contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=install-dvizh-hermes-autopilot-v2.2-owner-maintenance.sh
          bash -n "$SCRIPT"
          grep -Fq 'VERSION="2026.09.10-dvizh-owner-maintenance-v2.2.2-local-preserving"' "$SCRIPT"
          grep -Fq 'PAYLOAD_REF="57a2975bcfc47583e1f87250aca8eccddcfc9ebc"' "$SCRIPT"
          grep -Fq 'BASE_GATE_BLOB="b25a42654300f0e5595763a8b8753188039e34e3"' "$SCRIPT"
          grep -Fq 'TARGET_GATE_BLOB="cf6ec6e4915739fe0b7d2c609b41b4eb7c27d844"' "$SCRIPT"
          grep -Fq 'TARGET_SKILL_BLOB="3a68c550a328ec05a13ec86f1ad44aa4724c4fe1"' "$SCRIPT"
          grep -Fq 'LOCAL_SKILL_BLOB="082a6ce569a0c0c5bd34d00b8d1957a6d7bca233"' "$SCRIPT"
          grep -Fq 'Owner-delivered v2.2 privileged contract (local-preserving merge)' "$SCRIPT"
          grep -Fq 'new.startswith(old)' "$SCRIPT"
          grep -Fq "--approval 'APPROVE <proposal-id> <token>'" "$SCRIPT"
          test "$(git rev-parse 57a2975bcfc47583e1f87250aca8eccddcfc9ebc^{tree})" = a91ee82d29b9df1d56a37238f5cd6e678a91f110
          test "$(git rev-parse 57a2975bcfc47583e1f87250aca8eccddcfc9ebc:hermes-dev-v2/dvizhrelease.py)" = cf6ec6e4915739fe0b7d2c609b41b4eb7c27d844
          test "$(git rev-parse 57a2975bcfc47583e1f87250aca8eccddcfc9ebc:hermes-dev-v2/skill/SKILL.md)" = 3a68c550a328ec05a13ec86f1ad44aa4724c4fe1
          git show 57a2975bcfc47583e1f87250aca8eccddcfc9ebc:hermes-dev-v2/dvizhrelease.py > /tmp/dvizhrelease.py
          python3 -m py_compile /tmp/dvizhrelease.py
      - name: Local skill preservation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=install-dvizh-hermes-autopilot-v2.2-owner-maintenance.sh
          grep -Fq 'SKILL_KIND="local"' "$SCRIPT"
          grep -Fq 'SKILL_KIND="merged"' "$SCRIPT"
          grep -Fq 'local skill preservation check failed' "$SCRIPT"
          grep -Fq 'post-install local skill preservation check failed' "$SCRIPT"
          grep -Fq 'cp -a "$SKILL" "$BACKUP/SKILL.md"' "$SCRIPT"
          grep -Fq 'validate_merged_skill "$SKILL"' "$SCRIPT"
      - name: No root-surface expansion
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=install-dvizh-hermes-autopilot-v2.2-owner-maintenance.sh
          ! grep -Eq 'systemctl|iptables|ufw|authorized_keys|sudoers|id_ed25519|NOPASSWD' "$SCRIPT"
          ! grep -Eq 'rm -rf[[:space:]]+/|chmod[[:space:]]+-R|chown[[:space:]]+-R' "$SCRIPT"
          grep -Fq 'GATE="/usr/local/sbin/dvizhrelease"' "$SCRIPT"
          grep -Fq '.hermes/skills/dvizh/dvizh-dev/SKILL.md' "$SCRIPT"
          grep -Fq 'Rolling back owner-maintenance v2.2' "$SCRIPT"
          grep -Fq 'Services restarted: none' "$SCRIPT"
      - name: Confirm exact v2.2 payload lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 57a2975bcfc47583e1f87250aca8eccddcfc9ebc HEAD
          echo 'Compatibility installer is layered on the exact green v2.2 owner payload.'
