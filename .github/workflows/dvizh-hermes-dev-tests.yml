name: DVIZH Hermes Dev Mode CI

on:
  push:
    paths:
      - 'hermes-dev-v1/**'
      - 'tests/hermes_dev/**'
      - 'install-dvizh-hermes-dev.sh'
      - '.github/workflows/dvizh-hermes-dev-tests.yml'
  pull_request:
    paths:
      - 'hermes-dev-v1/**'
      - 'tests/hermes_dev/**'
      - 'install-dvizh-hermes-dev.sh'
      - '.github/workflows/dvizh-hermes-dev-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvizh-hermes-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and static safety boundary
        run: |
          set -euo pipefail
          python3 -m py_compile hermes-dev-v1/dvizhdevctl.py
          bash -n install-dvizh-hermes-dev.sh
          python3 - <<'PY'
          from pathlib import Path
          import re

          ctl = Path('hermes-dev-v1/dvizhdevctl.py').read_text(encoding='utf-8')
          skill = Path('hermes-dev-v1/skill/SKILL.md').read_text(encoding='utf-8')
          installer = Path('install-dvizh-hermes-dev.sh').read_text(encoding='utf-8')

          forbidden = {
              'root deploy parser': r'''sub\.add_parser\(["']deploy["']\)''',
              'force push': r'''git[^\n]{0,100}push[^\n]{0,100}(--force|['"]-f['"])''',
              'systemd mutation': r'''systemctl[^\n]{0,120}(restart|start|stop|enable|disable|daemon-reload)''',
              'sudo execution': r'''subprocess[^\n]{0,160}["']sudo["']''',
              'shell execution': r'''shell\s*=\s*True|os\.system|subprocess\.Popen''',
              'destructive git': r'''git[^\n]{0,100}(reset[^\n]*--hard|clean[^\n]*-[^\n]*f)''',
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, ctl):
                  raise SystemExit(f'forbidden {label} found')

          for marker in ('deploy-propose', 'pending-user-approval', 'GIT_TERMINAL_PROMPT'):
              if marker not in ctl:
                  raise SystemExit(f'missing controller marker: {marker}')
          for marker in ('Never run `sudo`', 'dvizhdevctl new', 'dvizhdevctl ci', 'production is read-only'):
              if marker.lower() not in skill.lower():
                  raise SystemExit(f'missing skill safety marker: {marker}')

          required_installer = (
              'VERSION="2026.09.06-hermes-dev-installer.3"',
              'PAYLOAD_REF="eb9457c759e2396eab13ccf14a55e7c39b79cd5f"',
              'CTL_BLOB="41a879b744be907cb379685038df1f5ee55e7b11"',
              'SKILL_BLOB="f6f62faa99b15069921971bfebb91b69e29e86a2"',
              'DVIZH_HERMES_DEV_PREPARE_ONLY',
          )
          for marker in required_installer:
              if marker not in installer:
                  raise SystemExit(f'missing installer pin: {marker}')
          if re.search(r'\bsystemctl\b|/etc/sudoers|sudoers\.d', installer):
              raise SystemExit('installer must not mutate systemd or sudoers')
          PY
      - name: Verify immutable installer payload without installing
        env:
          DVIZH_HERMES_DEV_PREPARE_ONLY: '1'
        run: bash install-dvizh-hermes-dev.sh
      - name: Exercise real managed worktree against public repository
        run: python3 -m unittest -v tests.hermes_dev.test_dvizhdevctl
      - name: Exercise installer through the same sudo boundary as production
        run: |
          set -euo pipefail
          target_user="$(id -un)"
          sudo env SUDO_USER="$target_user" bash "$GITHUB_WORKSPACE/install-dvizh-hermes-dev.sh"
          test "$(/usr/local/bin/dvizhdevctl version)" = '2026.09.06-hermes-dev.1'
          test -f "$HOME/.hermes/skills/dvizh/dvizh-dev/SKILL.md"
          grep -q '^name: dvizh-dev$' "$HOME/.hermes/skills/dvizh/dvizh-dev/SKILL.md"
          test -d "$HOME/.hermes/dev/dvizh/repo/.git"
          test "$(stat -c '%U' "$HOME/.hermes")" = "$target_user"
          test "$(stat -c '%U' "$HOME/.hermes/dev")" = "$target_user"
          test ! -e /etc/sudoers.d/dvizh-hermes-dev
          if command -v systemctl >/dev/null 2>&1; then
            ! systemctl list-unit-files --no-legend 2>/dev/null | grep -q 'dvizh-hermes-dev'
          fi

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [safety-and-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Verify deploy remains proposal-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('hermes-dev-v1/dvizhdevctl.py').read_text(encoding='utf-8')
          installer = Path('install-dvizh-hermes-dev.sh').read_text(encoding='utf-8')
          required = [
              'deploy_capability": "proposal-only; no apply/deploy command exists"',
              'INERT proposal only. dvizhdevctl has no deploy/apply command.',
              'pending-user-approval',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing release-gate marker: {marker}')
          if 'sub.add_parser("deploy")' in text or "sub.add_parser('deploy')" in text:
              raise SystemExit('direct deploy command exists')
          if 'PAYLOAD_REF="eb9457c759e2396eab13ccf14a55e7c39b79cd5f"' not in installer:
              raise SystemExit('installer payload is not immutable')
          PY
