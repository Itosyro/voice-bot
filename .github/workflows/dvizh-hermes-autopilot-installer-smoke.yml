name: DVIZH Hermes Autopilot installer smoke

on:
  push:
    paths:
      - 'install-dvizh-hermes-autopilot.sh'
      - '.github/workflows/dvizh-hermes-autopilot-installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-twice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install v1 controller prerequisite stub on disposable runner
        run: |
          set -Eeuo pipefail
          cat > /tmp/dvizhdevctl <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == config ]]; then
            printf '%s\n' '{"ok":true,"fixture":"v1-controller-present"}'
            exit 0
          fi
          printf '%s\n' '{"ok":true}'
          SH
          chmod 0755 /tmp/dvizhdevctl
          sudo install -o root -g root -m 0755 /tmp/dvizhdevctl /usr/local/bin/dvizhdevctl
      - name: Install Autopilot v2.1 and verify root-only Git key
        run: |
          set -Eeuo pipefail
          user="$(id -un)"
          sudo env SUDO_USER="$user" bash install-dvizh-hermes-autopilot.sh > /tmp/install1.txt
          test "$(/usr/local/bin/dvizhautopilot version)" = '2026.09.08-hermes-autopilot.2'
          sudo -u "$user" sudo -n /usr/local/sbin/dvizhrelease doctor >/tmp/release-doctor.json
          grep -Fq '"ok": true' /tmp/release-doctor.json
          set +e
          sudo -u "$user" sudo -n /usr/local/sbin/dvizhgitpush doctor >/tmp/git-doctor.json
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -Fq '"key_present": true' /tmp/git-doctor.json
          grep -Fq '"authorized": false' /tmp/git-doctor.json
          key='/var/lib/dvizh/autopilot-github/id_ed25519'
          test -f "$key" && test -f "$key.pub"
          test "$(sudo stat -c '%U:%G:%a' "$key")" = 'root:root:600'
          test "$(sudo stat -c '%U:%G:%a' "$key.pub")" = 'root:root:644'
          if sudo -u "$user" test -r "$key"; then
            echo 'Hermes user can unexpectedly read private deploy key' >&2
            exit 1
          fi
          before="$(sudo sha256sum "$key" "$key.pub")"
          sudo env SUDO_USER="$user" bash install-dvizh-hermes-autopilot.sh > /tmp/install2.txt
          after="$(sudo sha256sum "$key" "$key.pub")"
          test "$before" = "$after"
          grep -Fq 'ONE-TIME GITHUB SETUP REQUIRED' /tmp/install1.txt
          grep -Fq 'Другой проект в репозитории защищён' /tmp/install2.txt
          grep -Fq 'Приватный GitHub deploy key root:root 0600' /tmp/install2.txt
      - name: Confirm installed sudoers is exactly the two narrow gates
        run: |
          set -Eeuo pipefail
          user="$(id -un)"
          path=/etc/sudoers.d/dvizh-hermes-autopilot
          test "$(sudo stat -c '%U:%G:%a' "$path")" = 'root:root:440'
          expected1="$user ALL=(root) NOPASSWD: /usr/local/sbin/dvizhgitpush *"
          expected2="$user ALL=(root) NOPASSWD: /usr/local/sbin/dvizhrelease *"
          actual="$(sudo grep -v '^#' "$path" | sed '/^[[:space:]]*$/d')"
          expected="$(printf '%s\n%s' "$expected1" "$expected2")"
          test "$actual" = "$expected"
          ! sudo grep -Fq 'NOPASSWD: ALL' "$path"
          sudo -u "$user" sudo -n /usr/local/sbin/dvizhrelease doctor >/dev/null
          set +e
          sudo -u "$user" sudo -n /usr/local/sbin/dvizhgitpush doctor >/tmp/git-doctor2.json
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -Fq '"key_present": true' /tmp/git-doctor2.json
      - name: Controller exposes no private-key path
        run: |
          set -Eeuo pipefail
          ! grep -Fq 'id_ed25519' /usr/local/bin/dvizhautopilot
          grep -Fq 'private_git_key_visible_to_hermes' /usr/local/bin/dvizhautopilot
          grep -Fq 'FRIEND_PROJECT_MARKERS' /usr/local/sbin/dvizhgitpush
          grep -Fq 'CONTROL_PLANE_DENY' /usr/local/sbin/dvizhgitpush
