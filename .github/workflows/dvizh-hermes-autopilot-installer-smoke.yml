name: DVIZH Hermes Autopilot installer smoke

on:
  push:
    paths:
      - 'install-dvizh-hermes-autopilot.sh'
      - '.github/workflows/dvizh-hermes-autopilot-installer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-twice:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install v1 controller prerequisite stub on disposable runner
        run: |
          set -Eeuo pipefail
          cat > /tmp/dvizhdevctl <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == config ]]; then
            printf '%s\n' '{"ok":true,"fixture":"v1-controller-present"}'
            exit 0
          fi
          printf '%s\n' '{"ok":true}'
          SH
          chmod 0755 /tmp/dvizhdevctl
          sudo install -o root -g root -m 0755 /tmp/dvizhdevctl /usr/local/bin/dvizhdevctl
      - name: Install Autopilot v2 and verify root boundary
        run: |
          set -Eeuo pipefail
          user="$(id -un)"
          home="$HOME"
          sudo env SUDO_USER="$user" bash install-dvizh-hermes-autopilot.sh > /tmp/install1.txt
          test "$(/usr/local/bin/dvizhautopilot version)" = '2026.09.08-hermes-autopilot.1'
          sudo -u "$user" sudo -n /usr/local/sbin/dvizhrelease doctor >/tmp/doctor.json
          grep -Fq '"ok": true' /tmp/doctor.json
          sudo visudo -cf /etc/sudoers.d/dvizh-hermes-autopilot >/dev/null
          grep -Fq "$user ALL=(root) NOPASSWD: /usr/local/sbin/dvizhrelease *" /etc/sudoers.d/dvizh-hermes-autopilot
          ! grep -Fq 'NOPASSWD: ALL' /etc/sudoers.d/dvizh-hermes-autopilot
          key="$home/.hermes/dev/dvizh/github/id_ed25519"
          test -f "$key" && test -f "$key.pub"
          test "$(stat -c '%a' "$key")" = 600
          test "$(stat -c '%a' "$key.pub")" = 644
          before="$(sha256sum "$key" "$key.pub")"
          sudo env SUDO_USER="$user" bash install-dvizh-hermes-autopilot.sh > /tmp/install2.txt
          after="$(sha256sum "$key" "$key.pub")"
          test "$before" = "$after"
          grep -Fq 'ONE-TIME GITHUB SETUP REQUIRED' /tmp/install1.txt
          grep -Fq 'Production-приложение не изменено' /tmp/install2.txt
      - name: Confirm arbitrary passwordless sudo was not granted
        run: |
          set -Eeuo pipefail
          user="$(id -un)"
          if sudo -u "$user" sudo -n /bin/sh -c 'true' 2>/dev/null; then
            echo 'unexpected arbitrary passwordless sudo' >&2
            exit 1
          fi
          sudo -u "$user" sudo -n /usr/local/sbin/dvizhrelease doctor >/dev/null
