name: DVIZH AI Home v2 isolation tests

on:
  push:
    paths:
      - 'ai-home-v2/**'
      - 'tests/ai-home-v2/**'
      - 'install-dvizh-ai-home-v2.sh'
      - '.github/workflows/dvizh-ai-home-v2-tests.yml'
  pull_request:
    paths:
      - 'ai-home-v2/**'
      - 'tests/ai-home-v2/**'
      - 'install-dvizh-ai-home-v2.sh'
      - '.github/workflows/dvizh-ai-home-v2-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-home-v2-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and exercise isolated client and preview installer
        run: |
          set -euo pipefail
          bash -n install-dvizh-ai-home-v2.sh
          node --check ai-home-v2/ai-home-v2.js
          node --test tests/ai-home-v2/*.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tooling on this disposable CI runner only
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test real browser with a local fixture origin and mocked API
        run: python tests/ai-home-v2/browser_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-home-v2-browser
          path: test-results/
          if-no-files-found: warn
