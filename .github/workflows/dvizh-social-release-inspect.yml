name: DVIZH social release inspect

on:
  push:
    branches:
      - codex/dvizh-social-content-v1-2026-09-03-inspect
    paths:
      - 'social-release/**'
      - '.github/workflows/dvizh-social-release-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose and reconstruct archive
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== PART SIZES ====='
          wc -c social-release/part-*.b64
          echo '===== INVALID CHARACTERS ====='
          python - <<'PY'
          from pathlib import Path
          allowed=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n')
          for p in sorted(Path('social-release').glob('part-*.b64')):
              data=p.read_bytes()
              bad=[(i,b) for i,b in enumerate(data) if b not in allowed]
              print(p, 'len=',len(data),'bad=',bad[:20], 'count=',len(bad))
              print(' head=',data[:24])
              print(' tail=',data[-40:])
          joined=b''.join(p.read_bytes() for p in sorted(Path('social-release').glob('part-*.b64')))
          print('joined len=',len(joined),'mod4=',len(joined.replace(b'\n',b'').replace(b'\r',b''))%4)
          PY
          cat social-release/part-*.b64 | base64 --ignore-garbage --decode > /tmp/dvizh-social-release.tar.gz
          sha256sum /tmp/dvizh-social-release.tar.gz
          file /tmp/dvizh-social-release.tar.gz
          gzip -t /tmp/dvizh-social-release.tar.gz
          mkdir -p /tmp/dvizh-social-release
          tar -xzf /tmp/dvizh-social-release.tar.gz -C /tmp/dvizh-social-release
          echo '===== FILES ====='
          find /tmp/dvizh-social-release -type f -printf '%P\n' | sort
      - name: Static checks and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(find /tmp/dvizh-social-release -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$root"
          find "$root" -name '*.sh' -type f -print0 | xargs -0 -r -n1 bash -n
          python -m compileall -q "$root"
          if find "$root" -type f -path '*/tests/test_*.py' | grep -q .; then
            python -m pip install --upgrade pip pytest
            pytest -q "$root"
          fi
      - name: Upload reconstructed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvizh-social-release-inspect
          path: |
            /tmp/dvizh-social-release.tar.gz
            /tmp/dvizh-social-release
          if-no-files-found: warn
          retention-days: 1
