name: DVIZH social release inspection

on:
  push:
    branches:
      - codex/dvizh-social-content-v1-2026-09-03
    paths:
      - 'social-release/**'
      - '.github/workflows/dvizh-social-release-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose and reconstruct release
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, binascii, re, struct, zlib
          from pathlib import Path

          paths=[Path(f'social-release/part-{i:02d}.b64') for i in range(4)]
          parts=[]
          allowed=set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          for path in paths:
              raw=path.read_bytes()
              clean=re.sub(rb'\s+',b'',raw)
              bad=sorted(set(clean)-allowed)
              print(f'{path}: raw={len(raw)} clean={len(clean)} mod4={len(clean)%4} padding={clean.count(b"=")} bad={bad} head={clean[:12]!r} tail={clean[-12:]!r}')
              parts.append(clean)
          joined=b''.join(parts)
          print(f'joined clean={len(joined)} mod4={len(joined)%4} padding={joined.count(b"=")}')

          decoded=None
          for trim in range(0,4):
              candidate=joined[:-trim] if trim else joined
              if len(candidate)%4==1:
                  continue
              padded=candidate+b'='*((-len(candidate))%4)
              try:
                  decoded=base64.b64decode(padded,validate=True)
              except binascii.Error as exc:
                  print(f'decode trim={trim} failed: {exc}')
                  continue
              print(f'decode trim={trim} succeeded: compressed_bytes={len(decoded)}')
              break
          if decoded is None:
              raise SystemExit('No decodable base64 prefix')
          Path('/tmp/dvizh-social-release.tar.gz').write_bytes(decoded)

          inflater=zlib.decompressobj(16+zlib.MAX_WBITS)
          try:
              plain=inflater.decompress(decoded)+inflater.flush()
              print(f'gzip complete={inflater.eof} unused={len(inflater.unused_data)} uncompressed={len(plain)}')
          except zlib.error as exc:
              plain=inflater.unconsumed_tail
              raise SystemExit(f'gzip decode failed before yielding stream: {exc}')
          Path('/tmp/dvizh-social-release.partial.tar').write_bytes(plain)

          out=Path('/tmp/dvizh-social-release'); out.mkdir(parents=True,exist_ok=True)
          offset=0; complete=[]; partial=[]
          while offset+512<=len(plain):
              header=plain[offset:offset+512]
              if header==b'\0'*512:
                  break
              name=header[:100].split(b'\0',1)[0].decode('utf-8','replace')
              prefix=header[345:500].split(b'\0',1)[0].decode('utf-8','replace')
              if prefix: name=f'{prefix}/{name}'
              size_field=header[124:136].rstrip(b'\0 ').strip() or b'0'
              try: size=int(size_field,8)
              except ValueError:
                  print(f'invalid tar header at {offset}: name={name!r} size={size_field!r}')
                  break
              typeflag=header[156:157]
              data_start=offset+512; data_end=data_start+size
              if data_end>len(plain):
                  partial.append((name,size,max(0,len(plain)-data_start)))
                  break
              complete.append((name,size,typeflag))
              if typeflag in (b'0',b'\0') and name and not name.startswith('/') and '..' not in Path(name).parts:
                  target=out/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(plain[data_start:data_end])
              offset=data_start+((size+511)//512)*512
          print('=== COMPLETE TAR ENTRIES ===')
          for name,size,t in complete: print(f'{name} {size} type={t!r}')
          print('=== PARTIAL TAR ENTRY ===')
          for row in partial: print(row)
          print(f'parsed_offset={offset} stream_bytes={len(plain)} complete_entries={len(complete)}')
          if not complete:
              raise SystemExit('No complete tar entries recovered')
          PY
          echo '=== RECOVERED FILES ==='
          find /tmp/dvizh-social-release -type f -printf '%P %s bytes\n' | sort
      - name: Static checks for recovered files
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r file; do bash -n "$file"; done < <(find /tmp/dvizh-social-release -type f -name '*.sh' | sort)
          while IFS= read -r file; do python -m py_compile "$file"; done < <(find /tmp/dvizh-social-release -type f -name '*.py' | sort)
      - name: Scan recovered release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== VERSION / MARKERS ==='
          grep -RInE '2026\.|DVIZH_SOCIAL|social-content|dvizh-social|/social|/idea' /tmp/dvizh-social-release | head -n 300 || true
          echo '=== SYSTEMD ==='
          find /tmp/dvizh-social-release -type f -name '*.service' -print -exec cat {} \;
      - name: Upload recovered source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvizh-social-release-inspect
          path: |
            /tmp/dvizh-social-release.tar.gz
            /tmp/dvizh-social-release.partial.tar
            /tmp/dvizh-social-release
          if-no-files-found: warn
          retention-days: 1
