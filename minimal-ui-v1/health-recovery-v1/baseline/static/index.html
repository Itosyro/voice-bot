<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#0b0e11">
  <title>ДВИЖ</title>
  <link rel="stylesheet" href="/ai-home-v2.css?v=20260905-3.1-quiet-signal-2">
</head>
<body>
  <main class="ai" id="aiApp">
    <header class="ai-header">
      <div class="ai-header-inner">
        <div class="ai-brand">ДВИЖ <span>QUIET SIGNAL</span></div>
        <nav class="ai-modes" aria-label="Режим работы">
          <a href="#aiInput" aria-current="page">ИИ</a>
          <a id="aiManual" href="/manual.html?v=20260908-quiet-signal-2">Ручной</a>
        </nav>
      </div>
    </header>
    <section class="ai-core" aria-label="ИИ — ассистент">
      <div class="ai-inner">
        <p class="ai-eyebrow">01 / Ассистент</p>
        <div class="ai-signal">
          <div class="ai-heading">
            <p class="ai-status" id="aiStatus" role="status" aria-atomic="true"></p>
            <h1>Что сегодня в фокусе?</h1>
            <p class="ai-hint">Задача, тренировка или новая идея.</p>
          </div>
          <svg class="ai-ribbon" viewBox="0 0 1000 300" aria-hidden="true" focusable="false">
            <defs><linearGradient id="aiRibbonShade" x2="0" y2="1"><stop stop-color="#c8deea"/><stop offset=".5" stop-color="#648697"/><stop offset="1" stop-color="#34445e"/></linearGradient></defs>
            <g id="aiRibbonMesh"><path fill="url(#aiRibbonShade)" d="M40 150 C260 20 320 240 500 150 S760 40 960 150 C760 260 680 60 500 170 S260 280 40 150Z"/></g>
          </svg>
          <div class="ai-caption ai-eyebrow"><span>ДВИЖ / ИИ</span><span>Текст / голос</span></div>
        </div>
        <div class="ai-answer" id="aiAnswer" aria-live="polite" aria-atomic="true" tabindex="0" aria-label="Ответ ДВИЖа" hidden></div>
      </div>
    </section>
    <div class="ai-composer-wrap">
      <form class="ai-composer" id="aiComposer" autocomplete="off">
        <textarea id="aiInput" rows="1" maxlength="12000" placeholder="Напиши или скажи…" aria-label="Сообщение ДВИЖу"></textarea>
        <button class="ai-orb" id="aiOrb" type="button" aria-label="Говорить с ДВИЖем" aria-pressed="false" aria-describedby="aiHelp" title="Голосовой ввод; удерживай для ручного режима">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3M9 21h6"/></svg>
        </button>
        <button class="ai-send" id="aiSend" type="submit" aria-label="Отправить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </form>
      <p class="ai-help" id="aiHelp">Микрофон — говорить · Enter — отправить · Escape — отменить запись</p>
    </div>
    <section class="ai-auth" id="aiAuth" hidden>
      <p>Нужен вход в ДВИЖ.</p>
      <a id="aiAuthLink" href="/">Войти</a>
    </section>
  </main>
  <script src="/ai-home-v2.js?v=20260905-3.1-voice-20260908-speech-1-quiet-signal-2" defer></script>
</body>
</html>
